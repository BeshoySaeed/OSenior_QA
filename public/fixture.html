<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quality Inspector Fixture</title><style>body{margin:0}header{height:60px}main{padding:12px 20px}footer{position:absolute;top:600px;height:80px;width:100%}</style></head>
<body>
  <header id="mc-header" class="mc-header"><h2>Website header text</h2></header>
  <main>
    <h1>Checkout</h1>
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
    <label>Email <input id="email" type="email"></label>
    <button id="continue">Continue</button>
    <p id="website-only">Website only note</p>
    <p id="message" role="alert" hidden>Enter an email address</p>
  </main>
  <footer id="mc-footer" class="mc-footer"><p>Website footer text</p></footer>
  <script>
    document.querySelector('#continue').addEventListener('click', () => {
      if (!document.querySelector('#email').value) document.querySelector('#message').hidden = false;
    });
  </script>
</body></html>
