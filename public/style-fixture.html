<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Fixture</title>
  <style>
    :root { --spacing-lg: 20px; --spacing-xl: 40px; }
    body { margin: 0; font: 400 16px/20px Arial, sans-serif; color: rgb(0, 0, 0); }
    header { position: absolute; top: 0; width: 100%; height: 60px; padding: var(--spacing-lg) 0 0 var(--spacing-lg); box-sizing: border-box; }
    main { position: absolute; top: 60px; width: 100%; height: 120px; padding: var(--spacing-lg) 0 0 var(--spacing-lg); box-sizing: border-box; display: flex; flex-direction: column; gap: var(--spacing-lg); }
    footer { position: absolute; top: 600px; width: 100%; height: 80px; padding: var(--spacing-lg) 0 0 var(--spacing-lg); box-sizing: border-box; }
  </style>
</head>
<body>
  <header><span id="brand">Brand</span></header>
  <main><span id="alpha">Alpha</span><span id="beta">Beta</span></main>
  <footer><span id="legal">Legal</span></footer>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has('spacingMismatch')) document.querySelector('main').style.gap = 'var(--spacing-xl)';
    if (params.has('headerFooterMismatch')) {
      document.querySelector('header').style.paddingLeft = 'var(--spacing-xl)';
      document.querySelector('footer').style.paddingLeft = 'var(--spacing-xl)';
    }
  </script>
</body>
</html>
